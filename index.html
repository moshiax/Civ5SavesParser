<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#252923" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button id="themeToggle" class="theme-toggle" type="button" title="Switch theme">
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.6 8.6 0 1 0 20.3 15.4Z" /></svg>
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
    </button>
    <div id="notification" class="notification"><p></p></div>
    <main id="article" class="page">
      <section class="upload-panel">
        <div id="dropzone" class="dropzone" tabindex="0" role="button">
          <input
            id="fileInput"
            type="file"
            accept=".Civ5Save,.Civ5Replay"
            hidden
          />
          <strong id="dropTitle">Drop a .Civ5Save or .Civ5Replay</strong>
          <span id="dropHint"></span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section id="result" class="result" hidden>
        <header class="result-head">
          <h1 id="saveTitle">Save</h1>
          <span id="savePath" class="filename"></span>
        </header>
        <div class="metrics" id="details">
          <div class="metric"><span>TURN</span><b id="turn">—</b></div>
          <div class="metric">
            <span>MAP SIZE</span><b id="dimensions">—</b>
          </div>
          <div class="metric"><span>PLAY TIME</span><b id="playtime">—</b></div>
          <div class="metric"><span>DATA</span><b id="payloadSize">—</b></div>
        </div>
        <div class="content-grid">
          <section class="card">
            <h2>Players</h2>
            <div id="playerOverview" class="roster-wrap"></div>
          </section>
          <section class="card">
            <h2>Game setup</h2>
            <div id="facts" class="facts"></div>
            <div id="lobbyOptions" class="lobby-options" hidden></div>
            <div id="dlcRecords" class="slot-groups dlc-records" hidden></div>
          </section>
        </div>
        <nav class="tabs">
          <button class="active" data-tab="summary">Summary</button>
          <button data-tab="map">Map history</button>
          <button data-tab="events">Events</button>
          <button data-tab="history">Turn history</button>
          <button data-tab="units">Units</button>
          <button data-tab="players">Players</button>
          <button data-tab="metadata">Metadata</button>
          <button data-tab="strings">Strings</button>
        </nav>
        <div id="tabSections"></div>
        <section id="tabContentCard" class="card"><div id="tabContent" class="raw"></div></section>
      </section>
    </main>
    <script src="./assets/civ5-colors.js"></script>
    <script src="./assets/city-state-data.js"></script>
    <script src="./webm-muxer.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
